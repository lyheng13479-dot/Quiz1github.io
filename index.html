<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>លំហាត់ - ចូលប្រើប្រាស់ប្រព័ន្ធ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* កំណត់ទម្រង់ទូទៅ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Khmer Os Siemreap', 'Kantumruy Pro', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* ប្រអប់ Form ធំ */
        .login-card {
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        
        /* ចំណងជើង */
        h4 {
            margin-bottom: 25px;
            color: #1a1a1a;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
        }
        
        /* Group របស់ Input នីមួយៗ */
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13.5px;
            color: #4a5568;
            font-weight: 600;
        }
        
        /* ប្រអប់ Input ដែលមានថែម Icon */
        .input-group {
            position: relative;
        }
        .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 16px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 12px 12px 42px; /* ទុកកន្លែងខាងឆ្វេងសម្រាប់ Icon */
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Khmer Os Siemreap', sans-serif;
            font-size: 13px;
            color: #2d3748;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            outline: none;
        }
        
        /* បន្ទាត់ខណ្ឌ "បន្តជាមួយ" */
        .divider {
            text-align: center;
            margin: 25px 0 20px 0;
            font-size: 13px;
            color: #718096;
            position: relative;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background-color: #e2e8f0;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        
        /* ប៊ូតុង Social Media */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .social-icons a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid #e2e8f0;
            background-color: #ffffff;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .social-icons a:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .fa-facebook { color: #1877F2; font-size: 22px; }
        .fa-facebook-messenger { color: #006AFF; font-size: 22px; }
        .fa-apple { color: #000000; font-size: 22px; }
        
        /* ប៊ូតុង Submit */
        input[type="submit"] {
            width: 100%;
            padding: 13px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Khmer Os Siemreap', sans-serif;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2);
        }
        input[type="submit"]:hover {
            background-color: #2563eb;
        }
        
        /* តំណភ្ជាប់ជំនួយ */
        .help-center {
            text-align: center;
            margin-top: 20px;
        }
        .help-center a {
            color: #3b82f6;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
        }
        .help-center a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <form>
            <h4>សូមស្វាគមន៍មកកាន់ប្រព័ន្ធ</h4>
            
            <div class="form-group">
                <label for="txtEmail">អ៊ីម៉ែលចូលប្រើប្រាស់</label>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input 
                        type="text" 
                        id="txtEmail" 
                        name="email" 
                        placeholder="example@email.com" 
                        required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="txtPassword">លេខសម្ងាត់ចូលប្រើប្រាស់</label>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input 
                        type="password" 
                        id="txtPassword" 
                        name="password" 
                        placeholder="ត្រូវវាយបញ្ចូលពី 8 ទៅ 12 តួ" 
                        minlength="8" 
                        maxlength="12" 
                        required>
                </div>
            </div>
            
            <div class="divider">បន្តជាមួយ</div>
            
            <div class="social-icons">
                <a href="#" title="Facebook"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" title="Messenger"><i class="fa-brands fa-facebook-messenger"></i></a>
                <a href="#" title="Apple"><i class="fa-brands fa-apple"></i></a>
            </div>
            
            <div class="form-group">
                <input type="submit" value="ចូលទៅកាន់គណនី">
            </div>
            
            <div class="help-center">
                <a href="#">ត្រូវការជំនួយ?</a>
            </div>
        </form>
    </div>

</body>
</html>
